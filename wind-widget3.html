<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Widget 3 — Linn-Benton Rd & Hwy 30</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f5f5;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .widget {
      background: white;
      border: 2px solid #ff6b35;
      border-radius: 12px;
      padding: 20px 24px;
      width: 460px;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.15);
      color: #333;
    }

    .location {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ff6b35;
      margin-bottom: 2px;
    }

    .sublocation {
      font-size: 11px;
      color: #666;
      margin-bottom: 16px;
    }

    .main-content {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 14px;
    }

    .compass-wrap {
      flex-shrink: 0;
    }

    .compass {
      width: 170px;
      height: 170px;
    }

    .data-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .direction-label {
      font-size: 20px;
      font-weight: 700;
      color: #ff6b35;
      text-align: center;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat {
      background: #fff3cd;
      border: 1px solid #ff6b35;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #666;
      font-weight: 600;
    }

    .stat-value-group {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: #ff6b35;
      line-height: 1;
    }

    .stat-unit {
      font-size: 11px;
      color: #666;
      font-weight: 500;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #999;
      border-top: 1px solid #e0e0e0;
      padding-top: 12px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ccc;
      display: inline-block;
      margin-right: 5px;
      vertical-align: middle;
      transition: background 0.4s;
    }

    .status-dot.live { background: #28a745; box-shadow: 0 0 6px #28a745; }
    .status-dot.error { background: #dc3545; }

    .refresh-btn {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .refresh-btn:hover { color: #ff6b35; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin 1s linear infinite; }

    @media (max-width: 540px) {
      .widget {
        width: 320px;
      }
      
      .main-content {
        flex-direction: column;
        gap: 12px;
      }

      .compass {
        width: 150px;
        height: 150px;
      }

      .data-column {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="widget" id="widget">
  <div class="location">Wind Conditions</div>
  <div class="sublocation">Linn-Benton Rd &amp; Hwy 30</div>

  <div class="main-content">
    <div class="compass-wrap">
      <svg class="compass" id="compass" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer ring -->
        <circle cx="80" cy="80" r="76" fill="none" stroke="#ff6b35" stroke-width="2"/>
        <circle cx="80" cy="80" r="68" fill="none" stroke="#ffb399" stroke-width="0.5"/>

        <!-- Cardinal tick marks -->
        <g stroke="#ff6b35" stroke-width="2">
          <line x1="80" y1="4" x2="80" y2="16"/>
          <line x1="80" y1="144" x2="80" y2="156"/>
          <line x1="4" y1="80" x2="16" y2="80"/>
          <line x1="144" y1="80" x2="156" y2="80"/>
        </g>
        <!-- Intercardinal ticks -->
        <g stroke="#ff6b35" stroke-width="1">
          <line x1="134.1" y1="25.9" x2="126.8" y2="33.2"/>
          <line x1="25.9" y1="25.9" x2="33.2" y2="33.2"/>
          <line x1="25.9" y1="134.1" x2="33.2" y2="126.8"/>
          <line x1="134.1" y1="134.1" x2="126.8" y2="126.8"/>
        </g>

        <!-- Cardinal labels -->
        <text x="80" y="15" text-anchor="middle" fill="#ff0000" font-size="12" font-weight="700" font-family="'Segoe UI',sans-serif">N</text>
        <text x="80" y="153" text-anchor="middle" fill="#666" font-size="11" font-weight="600" font-family="'Segoe UI',sans-serif">S</text>
        <text x="152" y="84" text-anchor="middle" fill="#666" font-size="11" font-weight="600" font-family="'Segoe UI',sans-serif">E</text>
        <text x="8" y="84" text-anchor="middle" fill="#666" font-size="11" font-weight="600" font-family="'Segoe UI',sans-serif">W</text>

        <!-- Degree ring marks (every 30°) -->
        <g stroke="#ffb399" stroke-width="1">
          <line x1="80" y1="4" x2="80" y2="10" transform="rotate(30 80 80)"/>
          <line x1="80" y1="4" x2="80" y2="10" transform="rotate(60 80 80)"/>
          <line x1="80" y1="4" x2="80" y2="10" transform="rotate(90 80 80)"/>
          <line x1="80" y1="4" x2="80" y2="10" transform="rotate(120 80 80)"/>
          <line x1="80" y1="4" x2="80" y2="10" transform="rotate(150 80 80)"/>
          <line x1="80" y1="4" x2="80" y2="10" transform="rotate(210 80 80)"/>
          <line x1="80" y1="4" x2="80" y2="10" transform="rotate(240 80 80)"/>
          <line x1="80" y1="4" x2="80" y2="10" transform="rotate(270 80 80)"/>
          <line x1="80" y1="4" x2="80" y2="10" transform="rotate(300 80 80)"/>
          <line x1="80" y1="4" x2="80" y2="10" transform="rotate(330 80 80)"/>
        </g>

        <!-- Wind arrow group — rotates to show FROM direction -->
        <g id="wind-arrow" transform="rotate(0 80 80)">
          <!-- Arrow pointing down = wind coming from north -->
          <!-- Shaft -->
          <line x1="80" y1="28" x2="80" y2="110" stroke="#ff6b35" stroke-width="3" stroke-linecap="round"/>
          <!-- Arrowhead (pointing toward center = wind arriving here) -->
          <polygon points="80,115 73,100 87,100" fill="#ff6b35"/>
          <!-- Tail feathers -->
          <line x1="80" y1="28" x2="70" y2="44" stroke="#ff6b35" stroke-width="2" stroke-linecap="round"/>
          <line x1="80" y1="34" x2="70" y2="48" stroke="#ff6b35" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- Center dot -->
        <circle cx="80" cy="80" r="5" fill="white" stroke="#ff6b35" stroke-width="2"/>
      </svg>
    </div>

    <div class="data-column">
      <div class="direction-label" id="dir-label">— —</div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Speed</div>
          <div class="stat-value-group">
            <div class="stat-value" id="speed">—</div>
            <div class="stat-unit">mph</div>
          </div>
        </div>
        <div class="stat">
          <div class="stat-label">Gusts</div>
          <div class="stat-value-group">
            <div class="stat-value" id="gusts">—</div>
            <div class="stat-unit">mph</div>
          </div>
        </div>
        <div class="stat">
          <div class="stat-label">Direction</div>
          <div class="stat-value-group">
            <div class="stat-value" id="degrees" style="font-size:22px">—°</div>
            <div class="stat-unit">true</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div>
      <span class="status-dot" id="dot"></span>
      <span id="updated">Loading…</span>
    </div>
    <button class="refresh-btn" id="refresh-btn" title="Refresh" onclick="fetchWind()">&#8635;</button>
  </div>
</div>

<script>
  // Approximate coords for Linn-Benton Rd & Hwy 30, west of Cedar Rapids, IA
  const LAT = 41.978;
  const LON = -91.905;

  const DIRECTIONS = [
    'N','NNE','NE','ENE','E','ESE','SE','SSE',
    'S','SSW','SW','WSW','W','WNW','NW','NNW'
  ];

  function degreesToCompass(deg) {
    const idx = Math.round(deg / 22.5) % 16;
    return DIRECTIONS[idx];
  }

  function round1(n) {
    return Math.round(n * 10) / 10;
  }

  async function fetchWind() {
    const dot = document.getElementById('dot');
    const updated = document.getElementById('updated');
    const btn = document.getElementById('refresh-btn');

    dot.className = 'status-dot';
    updated.textContent = 'Updating…';
    btn.classList.add('spinning');

    const url =
      `https://api.open-meteo.com/v1/forecast` +
      `?latitude=${LAT}&longitude=${LON}` +
      `&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m` +
      `&wind_speed_unit=mph` +
      `&timezone=America%2FChicago`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const c = data.current;

      const speed = round1(c.wind_speed_10m);
      const gusts = round1(c.wind_gusts_10m);
      const dir   = Math.round(c.wind_direction_10m);
      const compass = degreesToCompass(dir);

      document.getElementById('speed').textContent   = speed;
      document.getElementById('gusts').textContent   = gusts;
      document.getElementById('degrees').textContent = dir + '°';
      document.getElementById('dir-label').textContent = `From ${compass}`;

      // Rotate arrow: arrow naturally points down (from N).
      // Wind direction is WHERE wind comes FROM, so we rotate by that angle.
      document.getElementById('wind-arrow').setAttribute(
        'transform', `rotate(${dir} 80 80)`
      );

      const now = new Date();
      const time = now.toLocaleTimeString('en-US', {
        hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
      });
      updated.textContent = `Updated ${time}`;
      dot.className = 'status-dot live';

    } catch (err) {
      updated.textContent = 'Error — retry?';
      dot.className = 'status-dot error';
      console.error(err);
    }

    btn.classList.remove('spinning');
  }

  // Initial load
  fetchWind();

  // Auto-refresh every 10 minutes
  setInterval(fetchWind, 10 * 60 * 1000);
</script>

</body>
</html>
